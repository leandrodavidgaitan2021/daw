<p-dialog 
  header="Mi Perfil de Usuario" 
  [visible]="visible()" 
  (visibleChange)="visibleChange.emit($event)"
  [modal]="true" 
  [style]="{ width: '450px' }" 
  [draggable]="false" 
  [resizable]="false"
  styleClass="p-fluid">
  
  <div class="p-2">
    @if (isLoading()) {
      <div class="text-center p-5">
        <i class="pi pi-spin pi-spinner text-3xl text-primary"></i>
        <p class="mt-2 text-600">Cargando perfil...</p>
      </div>
    } @else if (perfil(); as data) {
      <div class="flex flex-column gap-3">
        <div class="flex justify-content-between align-items-center border-bottom-1 surface-border pb-3">
          <span class="font-bold text-700">Nombre Completo:</span>
          <span class="text-900 font-medium">{{ data.nombres }} {{ data.apellidos }}</span>
        </div>

        <div class="flex justify-content-between align-items-center border-bottom-1 surface-border pb-3">
          <span class="font-bold text-700">Correo Electrónico:</span>
          <span class="text-900">{{ data.correo || 'No especificado' }}</span>
        </div>

        <div class="flex justify-content-between align-items-center border-bottom-1 surface-border pb-3">
          <span class="font-bold text-700">Documento:</span>
          <span class="text-900">{{ data.documento || 'No especificado' }}</span>
        </div>

        <div class="flex justify-content-between align-items-center pb-2">
          <span class="font-bold text-700">Rol en el Sistema:</span>
          <p-tag [value]="data.rol" severity="info" />
        </div>
      </div>
    }
  </div>

  <ng-template pTemplate="footer">
    <p-button 
      label="Cerrar" 
      icon="pi pi-times" 
      severity="secondary" 
      (onClick)="cerrar()"
    ></p-button>
  </ng-template>
</p-dialog>
