<p-toolbar styleClass="bg-primary px-4 shadow-2">
  <div class="p-toolbar-group-start">
    <a routerLink="/" class="text-xl font-bold text-white text-decoration-none cursor-pointer">
      Mi Aplicación TFI
    </a>
  </div>

  <div class="p-toolbar-group-end gap-3 align-items-center">
    @if (authStore.isAuthenticated()) {
      <!-- Mensaje de bienvenida y correo en la barra superior -->
      <span class="text-white font-medium">
        ¡Bienvenido, <span class="underline">{{ authStore.usuario()?.correo }}</span>!
      </span>
      <p-button 
        label="Cerrar Sesión" 
        icon="pi pi-power-off" 
        severity="danger" 
        size="small"
        (click)="authStore.logout()"
      ></p-button>
    } @else {
      <p-button 
        label="Iniciar Sesión" 
        icon="pi pi-sign-in" 
        severity="secondary" 
        size="small"
        routerLink="/login"
      ></p-button>
    }
  </div>
</p-toolbar>
